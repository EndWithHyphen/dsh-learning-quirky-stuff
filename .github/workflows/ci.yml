name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.56 supports this LTS image; ubuntu-latest can change its OS underneath CI.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run check:registry
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=low --registry=https://registry.npmjs.org/
      - run: npm run build
      - run: npm test
      - run: npm run test:install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:system-study-browser
      - run: npm run test:infographics-browser
      - run: npm run test:pdf-browser
      - run: npm run test:diagram-dependencies
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-node-${{ matrix.node }}
          path: dist/qa/
  macos-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run check:registry
      - run: npm ci --legacy-peer-deps
      - run: npm run build:native
      - run: npm run build
      - run: npm test
      - run: npm run test:install
      - run: npm run release:local
      - uses: actions/upload-artifact@v4
        with:
          name: studyboard-release
          path: dist/releases/
